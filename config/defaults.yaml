batch:
  # Debates run at once per batch job. Clamped to 1-3: higher hits provider
  # rate limits, and 1 makes big batches slow.
  concurrency: 2
judge:
  # Judge scoring defaults (explicit invocation only — judging bills per run).
  # Picked from the 2026-09-05 A/B on a 100-turn run: the small model's
  # fidelity verdicts were 87% unanimous across 3 votes (1 vote costs a third
  # and moves the score 1.7 points), and gpt-4.1's map votes were identical
  # across all three while sonar-pro's spread 0.62-0.95 at ~3.5x the price.
  fidelity_model: gemini-flash-lite-latest
  map_model: gpt-4.1
  votes: 1
agent_settings:
  chapter_every: 10
  history_window: 6
agents:
  moderator:
    auto_generate_title: true
    model: claude-opus-4-8
    temperature: 0.3
  opposition:
    aggression: 0.8
    model: gemini-3.1-flash-lite
    temperature: 0.4
  proposition:
    max_claims: 5
    model: gpt-4.1
    temperature: 0.7
  synthesiser:
    model: sonar
    temperature: 0.3
output:
  generate_markdown: true
  score_final_output: true
  store_argument_trace: true
protocol:
  max_steelman_attempts: 2
  max_time_minutes: 15
  max_turns: 100
  min_challenges: 5
  min_concessions: 2
  repetition_tolerance: 2
  require_full_resolution: false
  require_steelman: false
  token_budget: 100000
providers:
  model_order:
  - openai
  - anthropic
  - google
  - perplexity
  - moonshot
  - xai
ui:
  history_page_size: 50
