name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Declaring any permissions block drops every unlisted scope to none, so the
# one scope these jobs need (reading the checked-out code) is named explicitly.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -r requirements.txt

      - name: Test
        # No provider secrets: nothing in the suite makes a billable call, and
        # every registry-touching test points at a throwaway database. Run via
        # `python -m` so the repo root is on sys.path (the app has no src/
        # layout — agents/, core/, api/ are imported from the root).
        run: python -m pytest -q

  docs-gate:
    # The shiplock docs-vs-code gate also runs inside the suite
    # (tests/test_docs.py), but a dedicated step gives a clean pass/fail signal
    # in the Actions log and exercises the CLI path a release uses. Version-
    # independent, so it runs once rather than across the matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -r requirements.txt

      - name: Shiplock docs gate
        run: shiplock check
